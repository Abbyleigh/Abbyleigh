<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="460" viewBox="0 0 1440 460" role="img" aria-label="Abboryn Digital champagne glass business card">
<defs>
<linearGradient id="back" x2="1" y2="1"><stop stop-color="#9b755b"/><stop offset=".25" stop-color="#e6c8a9"/><stop offset=".52" stop-color="#806454"/><stop offset=".76" stop-color="#e8c5a3"/><stop offset="1" stop-color="#a58067"/></linearGradient>
<linearGradient id="glass" x2="1" y2="1"><stop stop-color="#f6dfc6" stop-opacity=".38"/><stop offset=".35" stop-color="#58453f" stop-opacity=".56"/><stop offset=".7" stop-color="#8d7163" stop-opacity=".66"/><stop offset="1" stop-color="#e8c4a5" stop-opacity=".35"/></linearGradient>
<linearGradient id="gold" x2="1" y2=".3"><stop stop-color="#ffe5c2"/><stop offset=".36" stop-color="#d5a77c"/><stop offset=".68" stop-color="#f5d7b5"/><stop offset="1" stop-color="#c99b76"/></linearGradient>
<linearGradient id="ribbon" x2="1" y2=".2"><stop stop-color="#fff4dc" stop-opacity="0"/><stop offset=".4" stop-color="#fff2d7" stop-opacity=".58"/><stop offset=".52" stop-color="#fffaf0" stop-opacity=".8"/><stop offset=".7" stop-color="#e2b18b" stop-opacity=".24"/><stop offset="1" stop-color="#fff4dc" stop-opacity="0"/></linearGradient>
<radialGradient id="halo"><stop stop-color="#fff1d5" stop-opacity=".7"/><stop offset="1" stop-color="#fff1d5" stop-opacity="0"/></radialGradient>
<filter id="blur"><feGaussianBlur stdDeviation="17"/></filter>
<filter id="soft"><feGaussianBlur stdDeviation="3"/></filter>
</defs>
<style>
.card{animation:float 9s ease-in-out infinite;transform-origin:720px 223px}
.sheen{animation:sheen 10s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(3px) rotate(-.3deg)}50%{transform:translateY(-5px) rotate(.3deg)}}
@keyframes sheen{0%,15%{transform:translateX(-1200px)}65%,100%{transform:translateX(1500px)}}
@media(prefers-reduced-motion:reduce){.card,.sheen{animation:none}}
</style>
<rect width="1440" height="460" fill="url(#back)"/>
<path d="M-100 155Q220 -40 610 80T1510 30M-80 360Q270 150 700 350T1520 180" stroke="url(#ribbon)" stroke-width="95" fill="none" filter="url(#blur)" opacity=".65"/>
<ellipse cx="720" cy="423" rx="550" ry="30" fill="#422a23" opacity=".3" filter="url(#blur)"/>
<g class="card">
<rect x="155" y="45" width="1130" height="363" rx="38" fill="#e5c4a7" opacity=".65" filter="url(#soft)"/>
<rect x="160" y="45" width="1120" height="355" rx="34" fill="url(#glass)" stroke="url(#gold)" stroke-width="5"/>
<rect x="173" y="58" width="1094" height="329" rx="26" fill="none" stroke="#fff1d8" stroke-opacity=".42" stroke-width="2"/>
<path d="M186 330Q330 120 470 52M990 397Q1100 250 1268 155" stroke="#fff1d6" stroke-opacity=".35" stroke-width="22" fill="none" filter="url(#blur)"/>
<g transform="translate(300 113)">
<text x="10" y="187" font-family="Georgia,Times New Roman,serif" font-style="italic" font-size="239" fill="url(#gold)">A</text>
<path d="M60 174Q145 87 275 151" fill="none" stroke="url(#gold)" stroke-width="6"/>
</g>
<path d="M625 108v208" stroke="#f5d5b2" stroke-width="3" opacity=".86"/>
<text x="933" y="215" text-anchor="middle" font-family="Georgia,Times New Roman,serif" font-size="82" letter-spacing="12" fill="url(#gold)">ABBORYN</text>
<text x="937" y="278" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="28" letter-spacing="20" fill="#f7ddbd">DIGITAL</text>
<text x="720" y="356" text-anchor="middle" font-family="Georgia,Times New Roman,serif" font-size="21" letter-spacing="5" fill="#ffe0bf">WEB DESIGN   |   SOFTWARE DEVELOPMENT   |   AI SOLUTIONS</text>
<path class="sheen" d="M-260 10l160 -40 500 530 -160 40z" fill="url(#ribbon)" opacity=".4"/>
</g>
<circle cx="165" cy="398" r="90" fill="url(#halo)"/><circle cx="1276" cy="52" r="85" fill="url(#halo)"/>
</svg>